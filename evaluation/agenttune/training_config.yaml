# AgentTune Training Configuration for ThreatLens AI
# Single source of truth for reproducible fine-tuning.

# Algorithm Configuration
algorithm: "grpo"  # Options: grpo, dpo, ppo, rloo, bco

# Model Configuration (Hugging Face Router — Tiny Aya Global)
base_model: "CohereLabs/tiny-aya-global:cohere"

# Training Parameters
learning_rate: 1e-5
batch_size: 2
num_epochs: 3
max_seq_length: 2048
gradient_accumulation_steps: 8

# LoRA Configuration
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "v_proj"
  - "k_proj"
  - "o_proj"

# Data Paths
train_data_path: "artifacts/agenttune/trajectories/train.jsonl"
val_data_path: "artifacts/agenttune/trajectories/val.jsonl"
test_data_path: "artifacts/agenttune/trajectories/test.jsonl"

# Output Configuration
output_dir: "artifacts/agenttune/checkpoints"
logging_steps: 5
save_steps: 25
eval_steps: 25

# Reward Weights (customizable — positive rewards only; penalties handled internally)
reward_weights:
  tool_selection: 1.0
  argument_accuracy: 1.0
  evidence_grounding: 1.5
  task_completion: 1.5
  classification_accuracy: 2.0
  escalation_accuracy: 1.5
  no_duplicate_calls: 0.5
  no_unsupported_conclusions: 1.0

# Hardware Configuration
# device: "auto" (cuda if available, else cpu). mixed_precision: fp32 on CPU, bf16/fp16 on GPU.
device: "auto"
mixed_precision: "fp32"
gradient_checkpointing: false

# Experiment Tracking
experiment_name: "threatlens-agenttune"
wandb_project: null
tags:
  - threatlens
  - cybersecurity
  - agenttune
  - tiny-aya

# Reproducibility
seed: 42
